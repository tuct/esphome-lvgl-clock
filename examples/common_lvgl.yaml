# Shared LVGL setup + colour palette for the lvgl_clock example_*.yaml
# configs. `packages:` merges dicts key-by-key, so this file's `lvgl:` keys
# (displays, rotation, bg_color) and each example's own `lvgl: widgets:` key
# combine into one `lvgl:` block - no list-merge semantics needed since only
# one side ever defines `widgets:`.

color:
  - id: cc_hands
    red: 100%
    green: 100%
    blue: 100%
  - id: cc_bg
    red: 0%
    green: 0%
    blue: 0%
  - id: cc_faces  # unlit "ghost" segments / little-clock faces
    red: 12%
    green: 12%
    blue: 14%

lvgl:
  displays: [my_display]
  rotation: 90
#  buffer_size: 25%
  bg_color: 0x000000
