# GitHub Pages for esphome-lvgl-clock.
#
# Deliberately NO duplicated content: the site is built from the READMEs that
# are already in the repo. Four plugins do the work, so there is nothing to
# install by hand and nothing to keep in sync:
#
#   jekyll-readme-index           a folder's README.md becomes its index page,
#                                 so links to a directory keep working
#   jekyll-relative-links         rewrites [x](./foo/README.md) to the built URL
#   jekyll-optional-front-matter  renders .md that has no YAML front matter
#   jekyll-remote-theme           pulls just-the-docs, which is not one of the
#                                 handful of themes Pages bundles
#
# Enable at Settings -> Pages -> Deploy from a branch -> main -> / (root).

title: Digital Clock Clock 24
description: >-
  A physical ClockClock 24 - a digital clock built from 24 little analogue ones,
  on 24 round screens and eight ESP32s, driven by ESPHome.
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: false

# ---- just-the-docs --------------------------------------------------------
# Search is the reason for this theme. There is a lot of specific fact buried in
# long pages - MAZE_FLOOR, the D6 strapping-pin warning, the 0.01 V measurement,
# pattern_delay - and no index anywhere.
search_enabled: true
search:
  heading_level: 3
  previews: 3
  rel_url: true
color_scheme: dark
heading_anchors: true

aux_links:
  "View on GitHub":
    - "https://github.com/tuct/esphome-lvgl-clock"
aux_links_new_tab: true

# ---- navigation -----------------------------------------------------------
# just-the-docs normally wants `title` and `nav_order` in each page's front
# matter. GitHub renders front matter as a table in its own Markdown view, which
# would put an ugly block at the top of every README in the repo - so the nav is
# supplied from here instead and the files stay clean.
defaults:
  # Every page gets the theme's layout. Without this the pages have front
  # matter (supplied here) but no `layout`, and Jekyll renders them as bare
  # HTML with no theme at all - the site would build and look broken.
  - scope: { path: "" }
    values: { layout: default }
  # The front page gets a layout that injects the live demo - see
  # _layouts/home.html for why it is not in README.md itself.
  # The order is by PURPOSE, not by what happens to exist: what you want to do
  # first (run one), then what you want to do next (make it do something new),
  # then reference. just-the-docs has no heading-only nav groups, so the purpose
  # has to live in the page titles.
  - scope: { path: "README.md" }
    values: { title: "Home", nav_order: 1, layout: home }
  - scope: { path: "modes.md" }
    values: { title: "What it does", nav_order: 2 }
  # Before the builds on purpose: it is the path that costs nothing and needs no
  # hardware, and it is how most people will meet the project.
  - scope: { path: "screens.md" }
    values: { title: "Run it on a screen", nav_order: 3 }
  - scope: { path: "homeassistant/README.md" }
    values: { title: "Control it from Home Assistant", nav_order: 4, has_children: true }
  - scope: { path: "homeassistant/DOCS.md" }
    values: { title: "Add-on reference", parent: "Control it from Home Assistant", nav_order: 1 }
  # The build guide is three pages: what it is and how to configure it, the
  # assembly sequence, and the reference material underneath. One 1300-line page
  # served none of those three readers well.
  - scope: { path: "digital_clock_clock_24_24_round_screens/README.md" }
    values: { title: "Build it: 24 round screens", nav_order: 5, has_children: true }
  - scope: { path: "digital_clock_clock_24_24_round_screens/BUILD.md" }
    values: { title: "Assembly, wiring and flashing", parent: "Build it: 24 round screens", nav_order: 1 }
  - scope: { path: "digital_clock_clock_24_24_round_screens/TECHNICAL.md" }
    values: { title: "Technical details", parent: "Build it: 24 round screens", nav_order: 2 }
  - scope: { path: "digital_clock_clock_24_24_round_screens/PROTOTYPE.md" }
    values: { title: "First prototype", parent: "Build it: 24 round screens", nav_order: 3 }
  - scope: { path: "digital_clock_clock_24_4_screens/README.md" }
    values: { title: "Build it: 4 screens", nav_order: 6 }
  # Examples and gifgen are about the component, not about the clock - they sit
  # under it rather than as siblings of the builds.
  - scope: { path: "components/lvgl_clock/README.md" }
    values: { title: "The component", nav_order: 7, has_children: true }
  - scope: { path: "examples/README.md" }
    values: { title: "Examples", parent: "The component", nav_order: 1 }
  - scope: { path: "tools/gifgen/README.md" }
    values: { title: "gifgen", parent: "The component", nav_order: 2 }
  - scope: { path: "images/hw/README.md" }
    values: { title: "Hardware photos", parent: "The component", nav_order: 3 }
  - scope: { path: "tools/clockclock24-sim/writing-a-mode.md" }
    values: { title: "Writing a choreography in code", nav_order: 8 }

# The sandbox is a static app and is copied through untouched: Jekyll only
# processes files that HAVE front matter, and its .html and .js have none.
#
# tools/clockclock24-sim/ contains index.html (the app), so the app wins the
# folder URL - which is the right way round, a link to the editor should run it.
#
# Its long-form doc is `writing-a-mode.md`, NOT a README, and that name is
# load-bearing. jekyll-readme-index skips a directory that already has an index,
# and a README it skips is never made into a page at all: it stays a static file
# and is served as raw text/markdown, missing from the nav entirely. Measured on
# the live site - /tools/clockclock24-sim/README.html was a 404 and README.md
# came back as text/markdown. Any other filename is an ordinary page.

exclude:
  # The add-on's payload is a STAGED COPY of the sandbox and the cards (Docker
  # cannot reach outside its build context). Publishing it would put a second,
  # stale sandbox on the site at a URL nothing links to.
  - homeassistant/app
  - .esphome
  - "**/.esphome"
  - "**/__pycache__"
  - "**/secrets.yaml"
  - Gemfile
  - Gemfile.lock
  - vendor
