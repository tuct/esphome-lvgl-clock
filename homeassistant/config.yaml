name: Digital Clock Clock 24
version: "0.2.1"
slug: digital_clock_clock_24
description: >-
  Draw ClockClock 24 motion patterns in the sidebar and write them straight to
  the wall - no compiling, no flashing.
url: https://github.com/tuct/esphome-lvgl-clock
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false

# Ingress: the editor is reachable from the sidebar with no port to open and no
# second login. It is a drawing tool, not a service anything else talks to, so
# there is nothing to gain from exposing a port.
ingress: true
ingress_port: 8099
panel_icon: mdi:clock-time-four-outline
panel_title: Clock Clock 24

# Needed to write a pattern into a text entity on the master, which is the one
# thing this add-on does to your system.
homeassistant_api: true

# Only to drop the Lovelace bundle into /config/www, so the cards land at
# /local/ without anyone downloading a file from GitHub by hand. Turn
# install_card off and this is never written to.
map:
  - config:rw

options:
  install_card: true
  entity_filter: pattern
schema:
  install_card: bool
  # A pattern slot is a text. entity, and a Home Assistant with other
  # integrations has plenty of those. Empty string lists them all.
  entity_filter: str
