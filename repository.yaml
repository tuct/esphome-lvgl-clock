# Makes this GitHub repository installable as a Home Assistant add-on
# repository: Settings -> Add-ons -> Add-on store -> ⋮ -> Repositories, then
# paste the repository URL.
#
# The Supervisor scans TOP-LEVEL directories for one containing config.yaml,
# and homeassistant/ is that directory - which is why the add-on IS the
# homeassistant folder rather than sitting one level inside it.
name: Digital Clock Clock 24
url: https://github.com/tuct/esphome-lvgl-clock
maintainer: tuct
